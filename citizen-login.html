<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Portal | Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center font-sans p-4">

  <div class="w-full max-w-md bg-white rounded-xl p-8 shadow-md border border-slate-200">
    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-slate-900">Citizen Connect</h1>
      <p class="text-sm text-slate-500 mt-1">Log in to report issues and track local municipal updates.</p>
    </div>

    <!-- Phone Step -->
    <div id="phoneStep" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-2">Mobile Number</label>
        <div class="relative flex rounded-lg overflow-hidden border border-slate-300 focus-within:border-emerald-600 transition">
          <span class="bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-500 border-r border-slate-300 select-none">+91</span>
          <input type="tel" id="phone" required placeholder="Enter 10-digit number" class="w-full bg-white px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:outline-none">
        </div>
      </div>
      <button onclick="requestOTP()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-lg transition text-sm">
        Request Login Code
      </button>
    </div>

    <!-- OTP Step -->
    <div id="otpStep" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-2">Enter 4-Digit OTP</label>
        <input type="text" id="otp" maxlength="4" placeholder="0000" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-3 text-center text-xl font-bold text-slate-900 tracking-[0.5em] focus:outline-none focus:border-emerald-600 transition">
        <div class="bg-slate-100 rounded-lg p-3 mt-2 text-xs text-slate-600 flex justify-between">
          <span>💡 Demo Code:</span>
          <span class="text-emerald-600 font-bold">1234</span>
        </div>
      </div>
      <button onclick="verifyOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition text-sm">
        Verify & Enter Portal
      </button>
    </div>

    <p id="errorMsg" class="text-xs font-medium text-rose-600 mt-4 text-center hidden"></p>
  </div>

  <script>
    async function requestOTP() {
      const phone = document.getElementById('phone').value;
      if(phone.length < 10) { alert("Please enter a valid number."); return; }
      
      document.getElementById('phoneStep').classList.add('hidden');
      document.getElementById('otpStep').classList.remove('hidden');
    }

    async function verifyOTP() {
      const otp = document.getElementById('otp').value;
      if(otp === "1234") {
        window.location.href = 'citizen-home.html';
      } else {
        document.getElementById('errorMsg').innerText = "Invalid OTP code.";
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
