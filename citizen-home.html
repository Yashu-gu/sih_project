<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Hub | Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style>
    .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }
    .goog-te-gadget { display: none !important; }
    .skiptranslate { display: none !important; }
  </style>

  <!-- Google Translate Initialization Script -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,ta,te,kn,ml,mr,bn',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 font-sans min-h-screen pb-12">

  <div id="google_translate_element" style="display:none;"></div>

  <header class="bg-[#1e293b] border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center max-w-7xl mx-auto rounded-b-xl shadow-md gap-4">
    <div class="flex items-center gap-2">
      <span class="text-emerald-500 text-xl">🌱</span>
      <h1 class="text-base font-bold text-white tracking-tight">Citizen Connect Portal</h1>
    </div>
    
    <div class="flex items-center gap-3">
      <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg px-2 py-1">
        <span class="text-xs mr-2">🌐</span>
        <select id="languageSelector" onchange="changeLanguage(this.value)" class="bg-transparent text-xs text-slate-200 font-medium focus:outline-none cursor-pointer">
          <option value="en" class="bg-slate-800">English</option>
          <option value="hi" class="bg-slate-800">हिंदी (Hindi)</option>
          <option value="ta" class="bg-slate-800">தமிழ் (Tamil)</option>
          <option value="te" class="bg-slate-800">తెలుగు (Telugu)</option>
          <option value="kn" class="bg-slate-800">ಕನ್ನಡ (Kannada)</option>
          <option value="ml" class="bg-slate-800">മലയാളം (Malayalam)</option>
          <option value="mr" class="bg-slate-800">मराठी (Marathi)</option>
          <option value="bn" class="bg-slate-800">বাংলা (Bengali)</option>
        </select>
      </div>

      <span class="text-xs font-semibold bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700">📍 Public Account</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-2 space-y-8">
      <div>
        <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4">🌐 Global Community Feed</h2>
        <div id="globalFeed" class="space-y-3"></div>
      </div>
    </div>

    <div class="bg-[#1e293b] p-6 rounded-xl border border-slate-800 shadow-md h-fit space-y-5">
      <h2 class="text-xs font-bold text-white uppercase tracking-widest border-b border-slate-800 pb-3">🚨 Lodge New Incident</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">1. Take / Attach Photo (Captures Location & AI Category)</label>
          <input type="file" id="incidentImage" accept="image/*" capture="environment" onchange="capturePhotoLocation(event)" class="w-full bg-[#0f172a] border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-emerald-950 file:text-emerald-400 file:border file:border-emerald-900 cursor-pointer">
        </div>

        <!-- AI AUTO-DETECTED CATEGORY DISPLAY -->
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">AI Classified Category</label>
          <div id="aiCategoryDisplay" class="w-full bg-[#0f172a] border border-slate-800 rounded-lg px-3 py-2.5 text-xs font-semibold text-emerald-400 flex items-center gap-2">
            <span>🤖</span>
            <span id="aiCategoryText">Awaiting image upload...</span>
          </div>
          <!-- Hidden input to hold the actual value for form submission -->
          <input type="hidden" id="issueType" value="Pending AI Classification">
        </div>

        <!-- DYNAMIC BENGALURU WARD SELECTION -->
        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">Ward Location (Bengaluru Areas)</label>
          <select id="wardSelect" class="w-full bg-[#0f172a] border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
            <option value="Koramangala">Koramangala (Ward 151)</option>
            <option value="Indiranagar">Indiranagar (Ward 112)</option>
            <option value="Whitefield">Whitefield (Ward 84)</option>
            <option value="Jayanagar">Jayanagar (Ward 153)</option>
            <option value="HSR Layout">HSR Layout (Ward 174)</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide">Issue Description</label>
            <button onclick="startVoiceInput()" type="button" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-bold bg-emerald-950/50 border border-emerald-900 px-2 py-0.5 rounded cursor-pointer">
              🎤 Voice Dictation
            </button>
          </div>
          <input type="text" id="issueDesc" placeholder="Describe the issue or click voice dictation..." class="w-full bg-[#0f172a] border border-slate-800 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">Photo Location Stamp</label>
          <div id="geoStatus" class="text-xs text-amber-400 bg-slate-900 border border-slate-800 p-2.5 rounded-lg font-mono">
            📷 Take a photo or upload to grab exact GPS coordinates...
          </div>
        </div>

        <button onclick="submitIssue()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition text-xs tracking-wider uppercase cursor-pointer">
          Broadcast Official Report
        </button>
      </div>

      <p id="msg" class="text-xs font-semibold mt-4 p-3 rounded-lg hidden text-center"></p>
    </div>
  </main>

  <script>
    let photoCoords = null;
    let offlineQueue = JSON.parse(localStorage.getItem('offlineComplaints')) || [];

    window.addEventListener('DOMContentLoaded', () => {
      loadFeed();
      const savedLang = localStorage.getItem('preferredLang');
      if (savedLang) {
        document.getElementById('languageSelector').value = savedLang;
        triggerTranslation(savedLang);
      }
    });

    window.addEventListener('online', syncOfflineQueue);

    function changeLanguage(langCode) {
      localStorage.setItem('preferredLang', langCode);
      triggerTranslation(langCode);
    }

    function triggerTranslation(langCode) {
      const checkInterval = setInterval(() => {
        const combo = document.querySelector('.goog-te-combo');
        if (combo && combo.options.length > 0) {
          clearInterval(checkInterval);
          setTimeout(() => {
            combo.value = langCode;
            combo.dispatchEvent(new Event('change'));
          }, 400);
        }
      }, 100);
    }

    // Reverse Geocoding via OpenStreetMap API to map lat/lon to dynamic Bengaluru Locality
    async function reverseGeocodeBengaluru(lat, lon) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
        const data = await response.json();
        const addr = data.address || {};
        const suburb = addr.suburb || addr.neighbourhood || addr.residential || addr.subdistrict || addr.city_district || "Koramangala";
        return suburb;
      } catch (err) {
        console.warn("Reverse geocoding failed, fallback to Koramangala:", err);
        return "Koramangala";
      }
    }

    function updateWardDropdown(detectedArea) {
      const select = document.getElementById('wardSelect');
      const cleanArea = detectedArea.toLowerCase();

      let matched = false;
      for (let option of select.options) {
        if (option.value.toLowerCase().includes(cleanArea) || cleanArea.includes(option.value.toLowerCase())) {
          select.value = option.value;
          matched = true;
          break;
        }
      }

      if (!matched) {
        const newOpt = document.createElement('option');
        newOpt.value = detectedArea;
        newOpt.innerText = `${detectedArea} (Auto-detected Ward)`;
        select.appendChild(newOpt);
        select.value = newOpt.value;
      }
    }

    async function capturePhotoLocation(event) {
      const file = event.target ? event.target.files[0] : event;
      if (!file) return;

      const status = document.getElementById('geoStatus');
      status.innerText = "⏳ Reverse geocoding Bengaluru area & running AI classification...";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            photoCoords = { latitude: lat.toFixed(4), longitude: lon.toFixed(4) };

            // Dynamic Reverse Geocoding
            const areaName = await reverseGeocodeBengaluru(lat, lon);
            updateWardDropdown(areaName);

            status.className = "text-xs text-emerald-400 bg-slate-900 border border-slate-800 p-2.5 rounded-lg font-mono";
            status.innerText = `📍 Stamped: Lat ${photoCoords.latitude}, Lon ${photoCoords.longitude} (Area: ${areaName})`;
          },
          async (err) => {
            photoCoords = { latitude: "12.9344", longitude: "77.6101" };
            const areaName = "Koramangala";
            updateWardDropdown(areaName);

            status.className = "text-xs text-amber-400 bg-slate-900 border border-slate-800 p-2.5 rounded-lg font-mono";
            status.innerText = `📍 Stamped (Default): Lat ${photoCoords.latitude}, Lon ${photoCoords.longitude} (Area: Koramangala)`;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }

      // Trigger AI Classification
      analyzeImageWithAI(file);
    }

    async function analyzeImageWithAI(file) {
      const categoryText = document.getElementById('aiCategoryText');
      const categoryInput = document.getElementById('issueType');
      const status = document.getElementById('geoStatus');

      categoryText.innerText = "🤖 Analyzing image with Gemini AI...";

      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        const base64Image = reader.result;

        try {
          const res = await fetch('http://localhost:3000/api/classify-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: base64Image })
          });

          const data = await res.json();

          if (data.success && data.category) {
            categoryText.innerText = data.category;
            categoryInput.value = data.category;

            status.innerText = `✨ AI Identified Issue: ${data.category}`;
            status.className = "text-xs text-emerald-400 bg-slate-900 border border-slate-800 p-2.5 rounded-lg font-mono";
          } else {
            const fallback = data.fallbackCategory || "Pothole / Road Damage";
            categoryText.innerText = fallback;
            categoryInput.value = fallback;
          }
        } catch (err) {
          console.warn("AI Classification server offline or error:", err);
          const fallback = "Pothole / Road Damage";
          categoryText.innerText = `${fallback} (Server Offline)`;
          categoryInput.value = fallback;
        }
      };
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is not supported on this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onstart = () => {
        document.getElementById('issueDesc').placeholder = "Listening...";
      };
      recognition.onresult = (event) => {
        document.getElementById('issueDesc').value = event.results[0][0].transcript;
      };
      recognition.start();
    }

    async function loadFeed() {
      try {
        const res = await fetch('http://localhost:3000/api/complaints');
        const data = await res.json();
        if (data.success) {
          const feed = document.getElementById('globalFeed');
          feed.innerHTML = data.complaints.map(item => `
            <div class="bg-[#1e293b] p-4 rounded-xl border border-slate-800 flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2 mb-2">
                  <span class="text-[10px] uppercase font-bold tracking-wider bg-amber-950/40 border border-amber-900/50 text-amber-400 px-2 py-0.5 rounded">${item.category}</span>
                  <span class="text-[10px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded">${item.ticketId || item.ticket_id || item.id}</span>
                  <span class="text-[10px] font-bold text-indigo-400 bg-indigo-950/50 border border-indigo-900 px-2 py-0.5 rounded">${item.ward || 'Koramangala'}</span>
                </div>
                <p class="text-xs text-slate-300">"${item.description}"</p>
                <span class="text-[10px] text-slate-500 block mt-2 font-mono">📍 Stamped Location: ${item.coords ? item.coords.latitude : item.latitude || '12.9344'}, ${item.coords ? item.coords.longitude : item.longitude || '77.6101'} | Assigned Officer: ${item.assigned_officer_name || 'BBMP Ward Engineer'} [${item.assigned_to_employee_id || item.officerId || 'EMP-201'}]</span>
              </div>
              <span class="text-xs font-bold text-emerald-400 px-2 py-1 bg-emerald-500/10 rounded">${item.status}</span>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error("Failed to load feed", err);
      }
    }

    async function submitIssue() {
      const msg = document.getElementById('msg');
      const issue = document.getElementById('issueType').value;
      const desc = document.getElementById('issueDesc').value;
      const ward = document.getElementById('wardSelect').value;
      const imageInput = document.getElementById('incidentImage');

      msg.classList.add('hidden');

      if (!photoCoords) {
        photoCoords = { latitude: "12.9344", longitude: "77.6101" };
      }

      let imageBase64 = null;
      if (imageInput && imageInput.files.length > 0) {
        const reader = new FileReader();
        reader.readAsDataURL(imageInput.files[0]);
        await new Promise(resolve => reader.onload = () => {
          imageBase64 = reader.result;
          resolve();
        });
      }

      const payload = {
        category: issue,
        description: desc,
        ward: ward,
        coords: photoCoords,
        latitude: photoCoords.latitude,
        longitude: photoCoords.longitude,
        imageBase64: imageBase64,
        image: imageBase64
      };

      if (!navigator.onLine) {
        offlineQueue.push(payload);
        localStorage.setItem('offlineComplaints', JSON.stringify(offlineQueue));
        msg.className = "text-xs font-semibold mt-4 p-3 rounded-lg text-center bg-amber-950/40 border border-amber-900 text-amber-400";
        msg.innerText = "📶 Saved locally with GPS location. Report will automatically sync when connected!";
        msg.classList.remove('hidden');
        resetForm();
        return;
      }

      sendComplaintToServer(payload);
    }

    async function sendComplaintToServer(payload) {
      const msg = document.getElementById('msg');
      msg.className = "text-xs font-semibold mt-4 p-3 rounded-lg text-center bg-slate-800 text-slate-300";
      msg.innerText = "🤖 Processing complaint & auto-routing to Bengaluru Ward Member...";
      msg.classList.remove('hidden');

      try {
        const response = await fetch('http://localhost:3000/api/submit-complaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.success) {
          msg.className = "text-xs font-semibold mt-4 p-3 rounded-lg text-center bg-emerald-950/40 border border-emerald-900 text-emerald-400";
          msg.innerText = `🎉 Lodged! Ticket ID: ${data.ticketId} — Routed to ${data.ticket.assigned_officer_name || 'Ward Officer'} [${data.ticket.assigned_to_employee_id || 'Assigned'}]`;
          resetForm();
          loadFeed();
        } else {
          msg.className = "text-xs font-semibold mt-4 p-3 rounded-lg text-center bg-rose-950/40 border border-rose-900 text-rose-400";
          msg.innerText = `❌ ${data.error || 'Submission rejected.'}`;
        }
      } catch (err) {
        msg.className = "text-xs font-semibold mt-4 p-3 rounded-lg text-center bg-rose-950/40 border border-rose-900 text-rose-400";
        msg.innerText = "❌ Server error or network connection lost.";
      }
    }

    function resetForm() {
      document.getElementById('issueDesc').value = '';
      document.getElementById('aiCategoryText').innerText = 'Awaiting image upload...';
      document.getElementById('issueType').value = 'Pending AI Classification';
      const imageInput = document.getElementById('incidentImage');
      if (imageInput) imageInput.value = '';
      photoCoords = null;
      document.getElementById('geoStatus').className = "text-xs text-amber-400 bg-slate-900 border border-slate-800 p-2.5 rounded-lg font-mono";
      document.getElementById('geoStatus').innerText = "📷 Take a photo or upload to grab exact GPS coordinates...";
    }

    function syncOfflineQueue() {
      if (offlineQueue.length > 0) {
        offlineQueue.forEach(payload => sendComplaintToServer(payload));
        offlineQueue = [];
        localStorage.removeItem('offlineComplaints');
      }
    }
  </script>
</body>
</html>
