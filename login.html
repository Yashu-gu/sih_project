<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civic Portal | Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style>
    .goog-te-banner-frame { display: none !important; }
    body { top: 0px !important; }
    .goog-te-gadget { display: none !important; }
    .skiptranslate { display: none !important; }
  </style>

  <!-- Google Translate Initialization Script -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,ta,te,kn,ml,mr,bn',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center font-sans p-4">

  <div id="google_translate_element" style="display:none;"></div>

  <div class="w-full max-w-md bg-white rounded-xl p-8 shadow-md border border-slate-200">
    
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Preferred Language</span>
      <div class="flex items-center bg-slate-100 border border-slate-200 rounded-lg px-2.5 py-1">
        <span class="text-xs mr-2">🌐</span>
        <select id="languageSelector" onchange="changeLanguage(this.value)" class="bg-transparent text-xs text-slate-700 font-medium focus:outline-none cursor-pointer">
          <option value="en">English</option>
          <option value="hi">हिंदी (Hindi)</option>
          <option value="ta">தமிழ் (Tamil)</option>
          <option value="te">తెలుగు (Telugu)</option>
          <option value="kn">ಕನ್ನಡ (Kannada)</option>
          <option value="ml">മലയാളം (Malayalam)</option>
          <option value="mr">मराठी (Marathi)</option>
          <option value="bn">বাংলা (Bengali)</option>
        </select>
      </div>
    </div>

    <div class="mb-6 text-center">
      <h1 id="card-title" class="text-2xl font-bold text-slate-900">Civic Portal Login</h1>
      <p id="card-desc" class="text-sm text-slate-500 mt-1">Select your portal access level to continue.</p>
    </div>

    <!-- Step 1: Role Selection -->
    <div id="step-role" class="space-y-3">
      <button onclick="selectRole('citizen')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition text-sm cursor-pointer">
        Login as Citizen
      </button>
      <button onclick="selectRole('staff')" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 rounded-lg transition text-sm cursor-pointer">
        Login as Staff Member
      </button>

      <!-- MODIFIED: Staff Details Step with Ward Selection & Employee ID -->
      <div id="staffDeptContainer" class="hidden mt-4 p-4 bg-slate-50 border border-slate-200 rounded-lg space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Employee ID</label>
          <input type="text" id="staffEmpId" placeholder="e.g. EMP-201" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium text-slate-800 focus:outline-none focus:border-emerald-600">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Assigned Department</label>
          <select id="staffDept" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium text-slate-800 focus:outline-none focus:border-emerald-600 cursor-pointer">
            <option value="Roads & Public Works (PWD)">Roads & Public Works (PWD)</option>
            <option value="Waste Management & Sanitation">Waste Management & Sanitation</option>
            <option value="Water Supply & Sewage">Water Supply & Sewage</option>
            <option value="Electrical & Streetlighting">Electrical & Streetlighting</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Assigned Ward Location</label>
          <select id="staffWard" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium text-slate-800 focus:outline-none focus:border-emerald-600 cursor-pointer">
            <option value="Koramangala">Koramangala (Ward 151)</option>
            <option value="Indiranagar">Indiranagar (Ward 112)</option>
            <option value="Whitefield">Whitefield (Ward 84)</option>
            <option value="Jayanagar">Jayanagar (Ward 153)</option>
            <option value="HSR Layout">HSR Layout (Ward 174)</option>
            <option value="All">All Wards (Department Head)</option>
          </select>
        </div>

        <button onclick="confirmStaffDetails()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg transition text-xs cursor-pointer">
          Confirm Staff Details & Continue
        </button>
      </div>
    </div>

    <!-- Step 2: Phone Input -->
    <div id="step-phone" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-2">Mobile Number</label>
        <div class="relative flex rounded-lg overflow-hidden border border-slate-300 focus-within:border-emerald-600 transition">
          <span class="bg-slate-100 px-4 py-3 text-sm font-semibold text-slate-500 border-r border-slate-300 select-none">+91</span>
          <input type="tel" id="phone" value="9876543210" maxlength="10" class="w-full bg-white px-4 py-3 text-sm text-slate-900 focus:outline-none">
        </div>
      </div>
      <button onclick="requestOTP()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-lg transition text-sm cursor-pointer">
        Send Access Code
      </button>
    </div>

    <!-- Step 3: OTP Verification -->
    <div id="step-otp" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-600 mb-2">4-Digit Security Code</label>
        <input type="text" id="otp" maxlength="4" placeholder="0000" class="w-full bg-white border border-slate-300 rounded-lg px-4 py-3 text-center text-xl font-bold text-slate-900 tracking-[0.5em] focus:outline-none focus:border-emerald-600 transition">
        <div class="bg-slate-100 rounded-lg p-3 mt-2 text-xs text-slate-600 flex justify-between">
          <span>💡 Demo Code:</span>
          <span class="text-emerald-600 font-bold">1234</span>
        </div>
      </div>
      <button onclick="verifyOTP()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition text-sm cursor-pointer">
        Authenticate & Enter
      </button>
    </div>

    <p id="errorMsg" class="text-xs font-medium text-rose-600 mt-4 text-center hidden"></p>
  </div>

  <script>
    let userRole = 'citizen';

    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferredLang');
      if (savedLang) {
        document.getElementById('languageSelector').value = savedLang;
        triggerTranslation(savedLang);
      }
    });

    function changeLanguage(langCode) {
      localStorage.setItem('preferredLang', langCode);
      triggerTranslation(langCode);
    }

    function triggerTranslation(langCode) {
      const checkInterval = setInterval(() => {
        const combo = document.querySelector('.goog-te-combo');
        if (combo && combo.options.length > 0) {
          clearInterval(checkInterval);
          setTimeout(() => {
            combo.value = langCode;
            combo.dispatchEvent(new Event('change'));
          }, 400);
        }
      }, 100);
    }

    function selectRole(role) {
      userRole = role;
      if (role === 'staff') {
        document.getElementById('staffDeptContainer').classList.remove('hidden');
      } else {
        proceedToPhoneStep();
      }
    }

    // MODIFIED: Function to handle Staff Details Validation & Store local variables
    function confirmStaffDetails() {
      const empId = document.getElementById('staffEmpId').value.trim();
      if (!empId) {
        showError("Please enter your Employee ID.");
        return;
      }
      hideError();
      proceedToPhoneStep();
    }

    function proceedToPhoneStep() {
      document.getElementById('step-role').classList.add('hidden');
      document.getElementById('step-phone').classList.remove('hidden');
      document.getElementById('card-title').innerText = userRole === 'citizen' ? 'Citizen Verification' : 'Staff Access Check';
    }

    function requestOTP() {
      const phone = document.getElementById('phone').value;
      if (phone.length < 10) {
        showError("Enter a valid 10-digit number.");
        return;
      }
      document.getElementById('step-phone').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
      hideError();
    }
    async function verifyOTP() {
      const otp = document.getElementById('otp').value;
      try {
        const response = await fetch('http://localhost:3000/api/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otp })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('userRole', userRole);
          
          if (userRole === 'staff') {
            const chosenDept = document.getElementById('staffDept').value;
            const chosenWard = document.getElementById('staffWard').value;
            const empId = document.getElementById('staffEmpId').value.trim();
            
            localStorage.setItem('staffDept', chosenDept);
            localStorage.setItem('staffWard', chosenWard);
            localStorage.setItem('staffEmpId', empId);

            // REDIRECT LOGIC FOR DEPARTMENT HEAD vs FIELD STAFF
            if (chosenWard === 'All') {
              window.location.href = 'dept-head.html'; // Dedicated Department Head Page
            } else {
              window.location.href = 'staff.html';     // Regular Field Staff Page
            }
          } else {
            window.location.href = 'citizen-home.html';
          }
        } else {
          showError(data.error || "Invalid OTP code.");
        }
      } catch (err) {
        showError("Backend connection failed. Make sure server.js is running.");
      }
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.innerText = msg;
      err.classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorMsg').classList.add('hidden');
    }
  </script>
</body>
</html>
