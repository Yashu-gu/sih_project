<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Control Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white">🏢 Municipal Staff Live Dispatch Dashboard</h1>
        <p id="deptBadge" class="text-xs text-emerald-400 font-semibold mt-1">
          Showing Queue for: <span id="currentDeptText" class="underline">All Departments</span>
        </p>
      </div>
      <div class="flex items-center gap-3">
        <select id="filterDeptSelect" onchange="changeFilterDept(this.value)" class="bg-slate-800 text-xs text-slate-300 border border-slate-700 rounded-lg px-3 py-2 focus:outline-none cursor-pointer">
          <option value="All">All Departments</option>
          <option value="Pothole / Road Damage">Pothole / Road Damage</option>
          <option value="Streetlight Malfunction">Streetlight Malfunction</option>
          <option value="Garbage Accumulation">Garbage Accumulation</option>
          <option value="Water Leakage">Water Leakage</option>
        </select>
        <button onclick="fetchStaffData()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded-lg text-slate-300 transition cursor-pointer">
          🔄 Refresh Live Stream
        </button>
      </div>
    </header>

    <!-- Full Citizen-Style Complaint Recording Form for Staff -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-5 space-y-4 shadow-md">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-700 pb-3">🚨 Lodge Incident via Staff Portal</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Left Column: Photo & Location -->
        <div class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">1. Take / Attach Photo (Captures Location & AI Category)</label>
            <input type="file" id="staffIncidentImage" accept="image/*" capture="environment" onchange="capturePhotoLocation()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 file:mr-3 file:py-1 file:px-2.5 file:rounded file:border-0 file:text-[10px] file:font-semibold file:bg-emerald-950 file:text-emerald-400 file:border file:border-emerald-900 cursor-pointer">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">Photo Location Stamp</label>
            <div id="staffGeoStatus" class="text-xs text-amber-400 bg-slate-900 border border-slate-700 p-2.5 rounded-lg font-mono">
              📷 Take a photo or upload to grab exact GPS coordinates...
            </div>
          </div>
        </div>

        <!-- Right Column: Category, Description & Submit -->
        <div class="space-y-4">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-2">Category (Auto-Categorized by AI Photo)</label>
            <select id="staffIssueType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
              <option value="Auto">🤖 Auto-Detect Category via AI Photo</option>
              <option value="Pothole / Road Damage">Pothole / Road Damage</option>
              <option value="Streetlight Malfunction">Streetlight Malfunction</option>
              <option value="Garbage Accumulation">Garbage Accumulation</option>
              <option value="Water Leakage">Water Leakage</option>
            </select>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wide">Issue Description</label>
              <button onclick="startVoiceInput()" type="button" class="text-[10px] text-emerald-400 hover:text-emerald-300 font-bold bg-emerald-950/50 border border-emerald-900 px-2 py-0.5 rounded cursor-pointer">
                🎤 Voice Dictation
              </button>
            </div>
            <input type="text" id="staffIssueDesc" placeholder="Describe the issue or click voice dictation..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>

      <button onclick="submitStaffIssue()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition text-xs tracking-wider uppercase cursor-pointer">
        Broadcast Official Report
      </button>

      <p id="staffMsg" class="text-xs font-semibold mt-2 p-2.5 rounded-lg hidden text-center"></p>
    </div>

    <!-- Live Incident Stream with SLA Timer & Action Tools -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Incoming Live Incidents</h2>
      <div id="staffTicketsList" class="space-y-4">
        <p class="text-xs text-slate-400">Loading incoming tickets...</p>
      </div>
    </div>
  </div>

  <script>
    let activeDept = localStorage.getItem('staffDept') || 'All';
    let photoCoords = null;
    let localSlaExtensions = JSON.parse(localStorage.getItem('slaExtensions')) || {};
    let offlineQueue = JSON.parse(localStorage.getItem('offlineComplaints')) || [];

    window.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('filterDeptSelect');
      if (select) select.value = activeDept;
      updateDeptBadge();
      fetchStaffData();
    });

    window.addEventListener('online', syncOfflineQueue);

    function changeFilterDept(dept) {
      activeDept = dept;
      localStorage.setItem('staffDept', dept);
      updateDeptBadge();
      fetchStaffData();
    }

    function updateDeptBadge() {
      document.getElementById('currentDeptText').innerText = activeDept;
    }

    // Capture GPS coordinates immediately when photo is selected/taken
    function capturePhotoLocation() {
      const status = document.getElementById('staffGeoStatus');
      status.innerText = "⏳ Acquiring photo capture location...";
      
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            photoCoords = {
              latitude: pos.coords.latitude.toFixed(4),
              longitude: pos.coords.longitude.toFixed(4)
            };
            status.className = "text-xs text-emerald-400 bg-slate-900 border border-slate-700 p-2.5 rounded-lg font-mono";
            status.innerText = `📍 Location Stamped: Lat ${photoCoords.latitude}, Lon ${photoCoords.longitude}`;
          },
          (err) => {
            photoCoords = { latitude: "12.9716", longitude: "77.5946" };
            status.className = "text-xs text-amber-400 bg-slate-900 border border-slate-700 p-2.5 rounded-lg font-mono";
            status.innerText = `📍 Location Stamped (Default): Lat ${photoCoords.latitude}, Lon ${photoCoords.longitude}`;
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    }

    function startVoiceInput() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Voice recognition is not supported on this browser.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onstart = () => {
        document.getElementById('staffIssueDesc').placeholder = "Listening...";
      };
      recognition.onresult = (event) => {
        document.getElementById('staffIssueDesc').value = event.results[0][0].transcript;
      };
      recognition.start();
    }

    async function fetchStaffData() {
      try {
        const response = await fetch('http://localhost:3000/api/complaints');
        const data = await response.json();

        if (data.success) {
          const list = document.getElementById('staffTicketsList');

          let filteredComplaints = data.complaints;
          if (activeDept && activeDept !== 'All') {
            filteredComplaints = data.complaints.filter(c => c.category === activeDept);
          }

          if (filteredComplaints.length === 0) {
            list.innerHTML = `<p class="text-xs text-slate-400">No active complaints logged for ${activeDept}.</p>`;
            return;
          }

          list.innerHTML = filteredComplaints.map(ticket => {
            const createdAt = new Date(ticket.timestamp || Date.now()).getTime();
            const extensionHours = localSlaExtensions[ticket.ticketId] || 0;
            const slaDeadline = createdAt + ((48 + extensionHours) * 60 * 60 * 1000);
            const remainingMs = slaDeadline - Date.now();
            
            let slaBadge = "";
            if (remainingMs > 0) {
              const hoursLeft = Math.floor(remainingMs / (1000 * 60 * 60));
              const minsLeft = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
              slaBadge = `<span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-mono">⏳ 48h SLA: ${hoursLeft}h ${minsLeft}m remaining</span>`;
            } else {
              slaBadge = `<span class="text-[10px] bg-rose-500/20 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded font-mono font-bold">⚠️ OVERDUE</span>`;
            }

            return `
              <div class="bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-3">
                <div class="flex justify-between items-start flex-wrap gap-2">
                  <div>
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-sm font-bold text-emerald-400">${ticket.ticketId}</span>
                      <span class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">${ticket.category}</span>
                      ${slaBadge}
                      ${extensionHours > 0 ? `<span class="text-[10px] text-emerald-400 bg-emerald-950 px-1.5 py-0.5 rounded border border-emerald-800">+${extensionHours}h Extension Active</span>` : ''}
                    </div>
                    <p class="text-xs text-slate-300 mt-2">"${ticket.description}"</p>
                    <p class="text-[10px] text-slate-500 font-mono mt-1">📍 Coords: ${ticket.coords ? ticket.coords.latitude : ticket.latitude}, ${ticket.coords ? ticket.coords.longitude : ticket.longitude}</p>
                  </div>
                  <span class="text-xs font-bold px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full">
                    ${ticket.status}
                  </span>
                </div>

                <!-- Action Toolbar for Staff -->
                <div class="border-t border-slate-800 pt-3 flex flex-wrap justify-between items-center gap-2">
                  <div class="flex items-center gap-2">
                    <span class="text-[11px] text-slate-400 font-medium">Update Status:</span>
                    <button onclick="updateTicketStatus('${ticket.ticketId}', 'In Progress')" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-200 px-2 py-1 rounded border border-slate-700 cursor-pointer">⚙️ In Progress</button>
                    <button onclick="updateTicketStatus('${ticket.ticketId}', 'Resolved')" class="text-[10px] bg-emerald-950 hover:bg-emerald-900 text-emerald-400 px-2 py-1 rounded border border-emerald-800 cursor-pointer">✅ Resolve</button>
                  </div>
                  
                  <button onclick="requestExtension('${ticket.ticketId}')" class="text-[10px] bg-slate-800 hover:bg-amber-950 text-amber-400 border border-slate-700 hover:border-amber-900 px-2.5 py-1 rounded transition cursor-pointer">
                    ⏰ Request +24h Extension
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (err) {
        console.error("Staff fetch failed:", err);
      }
    }

    async function submitStaffIssue() {
      const msg = document.getElementById('staffMsg');
      const issue = document.getElementById('staffIssueType').value;
      const desc = document.getElementById('staffIssueDesc').value;
      const imageInput = document.getElementById('staffIncidentImage');

      msg.classList.add('hidden');

      if (!photoCoords) {
        photoCoords = { latitude: "12.9716", longitude: "77.5946" };
      }

      let imageBase64 = null;
      if (imageInput && imageInput.files.length > 0) {
        const reader = new FileReader();
        reader.readAsDataURL(imageInput.files[0]);
        await new Promise(resolve => reader.onload = () => {
          imageBase64 = reader.result;
          resolve();
        });
      }

      const payload = {
        category: issue,
        description: desc,
        coords: photoCoords,
        image: imageBase64
      };

      if (!navigator.onLine) {
        offlineQueue.push(payload);
        localStorage.setItem('offlineComplaints', JSON.stringify(offlineQueue));
        msg.className = "text-xs font-semibold mt-2 p-2.5 rounded-lg text-center bg-amber-950/40 border border-amber-900 text-amber-400";
        msg.innerText = "📶 Saved locally with GPS location. Will sync when online!";
        msg.classList.remove('hidden');
        resetStaffForm();
        return;
      }

      sendStaffComplaintToServer(payload);
    }

    async function sendStaffComplaintToServer(payload) {
      const msg = document.getElementById('staffMsg');
      msg.className = "text-xs font-semibold mt-2 p-2.5 rounded-lg text-center bg-slate-800 text-slate-300";
      msg.innerText = "🤖 AI Analyzing photo & verifying authenticity...";
      msg.classList.remove('hidden');

      try {
        const response = await fetch('http://localhost:3000/api/submit-complaint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.success) {
          msg.className = "text-xs font-semibold mt-2 p-2.5 rounded-lg text-center bg-emerald-950/40 border border-emerald-900 text-emerald-400";
          msg.innerText = `🎉 Lodged! Ticket ID: ${data.ticketId} — AI Categorized as: [${data.ticket.category}]`;
          resetStaffForm();
          fetchStaffData();
        } else {
          msg.className = "text-xs font-semibold mt-2 p-2.5 rounded-lg text-center bg-rose-950/40 border border-rose-900 text-rose-400";
          msg.innerText = `❌ ${data.error || 'Submission rejected.'}`;
        }
      } catch (err) {
        msg.className = "text-xs font-semibold mt-2 p-2.5 rounded-lg text-center bg-rose-950/40 border border-rose-900 text-rose-400";
        msg.innerText = "❌ Server error or network connection lost.";
      }
    }

    function resetStaffForm() {
      document.getElementById('staffIssueDesc').value = '';
      const imageInput = document.getElementById('staffIncidentImage');
      if (imageInput) imageInput.value = '';
      photoCoords = null;
      document.getElementById('staffGeoStatus').className = "text-xs text-amber-400 bg-slate-900 border border-slate-700 p-2.5 rounded-lg font-mono";
      document.getElementById('staffGeoStatus').innerText = "📷 Take a photo or upload to grab exact GPS coordinates...";
    }

    function syncOfflineQueue() {
      if (offlineQueue.length > 0) {
        offlineQueue.forEach(payload => sendStaffComplaintToServer(payload));
        offlineQueue = [];
        localStorage.removeItem('offlineComplaints');
      }
    }

    function updateTicketStatus(ticketId, newStatus) {
      alert(`Status for ${ticketId} updated to: ${newStatus}`);
      fetchStaffData();
    }

    function requestExtension(ticketId) {
      const reason = prompt("State reason for needing extra 24 hours extension:");
      if (reason) {
        localSlaExtensions[ticketId] = (localSlaExtensions[ticketId] || 0) + 24;
        localStorage.setItem('slaExtensions', JSON.stringify(localSlaExtensions));
        alert(`Extension granted (+24h) for ticket ${ticketId}. Reason: "${reason}"`);
        fetchStaffData();
      }
    }

    setInterval(fetchStaffData, 5000);
  </script>
</body>
</html>
