<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Portal - Citizen Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">

  <!-- Top Navigation Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">
        CC
      </div>
      <div>
        <h1 class="text-lg font-bold leading-none text-slate-100">Staff Portal</h1>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-xs text-slate-400">Logged in Department:</span>
          <!-- Active Staff Department Selector -->
          <select id="staff-dept-select" onchange="switchStaffDepartment()" class="bg-slate-800 border border-slate-700 text-xs text-indigo-300 font-bold rounded-lg px-2 py-0.5 focus:outline-none focus:border-indigo-500">
            <option value="Electrical & Streetlighting">Electrical & Streetlighting</option>
            <option value="Roads & Public Works (PWD)">Roads & Public Works (PWD)</option>
            <option value="Water Supply & Sewage">Water Supply & Sewage</option>
            <option value="Waste Management & Sanitation">Waste Management & Sanitation</option>
          </select>
        </div>
      </div>
    </div>

    <div class="flex items-center space-x-4">
      <button onclick="openComplaintModal()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/20">
        <span>➕</span> Register New Field Issue
      </button>

      <button onclick="fetchComplaints()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition border border-slate-700">
        🔄 Refresh
      </button>

      <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl px-3 py-1.5 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="text-xs font-semibold text-slate-300" id="staff-id-display">Officer ID: STF-8842</span>
      </div>
      
      <a href="login.html" class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg text-xs font-semibold border border-rose-500/20 transition">
        Logout
      </a>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="max-w-7xl mx-auto px-6 pt-6">
    <div class="flex border-b border-slate-800 space-x-2">
      <button id="tab-my-issues" onclick="switchTab('my_issues')" class="px-4 py-2.5 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition flex items-center gap-2">
        <span>👤</span> My Registered Issues <span id="badge-my-count" class="bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full text-[10px]">0</span>
      </button>
      <button id="tab-dept-action" onclick="switchTab('dept_action')" class="px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center gap-2">
        <span>🛠️</span> Actionable Department Queue <span id="badge-dept-count" class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full text-[10px]">0</span>
      </button>
      <button id="tab-area-all" onclick="switchTab('area_all')" class="px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center gap-2">
        <span>🌐</span> All Area Issues (Read-Only) <span id="badge-all-count" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full text-[10px]">0</span>
      </button>
    </div>
  </div>

  <!-- Main View Container -->
  <div class="max-w-7xl mx-auto p-6">
    
    <!-- Tab Description Header -->
    <div class="mb-6 bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
      <div>
        <h2 id="view-title" class="text-sm font-bold text-slate-100">My Registered Issues</h2>
        <p id="view-description" class="text-xs text-slate-400 mt-0.5">Issues reported directly by Officer STF-8842 formatted like citizen tracking view.</p>
      </div>
      <div id="view-status-pill" class="text-xs px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold">
        Officer Tracking
      </div>
    </div>

    <!-- Feed Container -->
    <div id="feed-container" class="space-y-4">
      <div class="p-8 text-center text-slate-500 text-xs bg-slate-900 border border-slate-800 rounded-2xl">Loading tickets...</div>
    </div>

  </div>

  <!-- Register Complaint Modal -->
  <div id="register-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-bold text-slate-100 flex items-center gap-2">
          <span>📸</span> Field Incident Registration
        </h3>
        <button onclick="closeComplaintModal()" class="text-slate-400 hover:text-white text-lg font-bold">✕</button>
      </div>

      <form id="staff-complaint-form" onsubmit="handleCitizenComplaintSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">
            Photo Evidence <span class="text-xs font-normal text-indigo-400">(Triggers Auto-GPS & AI Category)</span>
          </label>
          <input type="file" id="citizen-image" accept="image/*" required onchange="handleImageCaptured()" class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-indigo-400 hover:file:bg-slate-700 cursor-pointer"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Contact Phone</label>
          <input type="tel" id="citizen-phone" placeholder="+91 9876543210" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Location Details</label>
          <div class="flex gap-2">
            <input type="text" id="citizen-location" required placeholder="Street / Landmark / GPS Coordinates" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500" />
            <button type="button" onclick="getGPSLocation()" class="px-3 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 rounded-xl text-xs font-bold border border-indigo-500/30 shrink-0 flex items-center gap-1">
              📍 GPS
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Description</label>
          <textarea id="citizen-description" rows="3" placeholder="Describe the issue observed in field..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div id="modal-status" class="hidden text-xs p-2.5 rounded-xl"></div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeComplaintModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold transition">Cancel</button>
          <button type="submit" id="submit-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/20">Submit Incident</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';
    const CURRENT_OFFICER_ID = 'STF-8842';
    
    let allComplaints = [];
    let currentTab = 'my_issues';

    window.addEventListener('DOMContentLoaded', () => {
      const savedDept = localStorage.getItem('staffDept');
      if (savedDept) {
        const deptSelect = document.getElementById('staff-dept-select');
        if ([...deptSelect.options].some(o => o.value === savedDept)) {
          deptSelect.value = savedDept;
        }
      }
      fetchComplaints();
    });

    function getLoggedDepartment() {
      return document.getElementById('staff-dept-select').value;
    }

    function switchStaffDepartment() {
      localStorage.setItem('staffDept', getLoggedDepartment());
      renderCurrentTab();
    }

    async function fetchComplaints() {
      try {
        const res = await fetch(`${API_BASE}/complaints`);
        const data = await res.json();
        
        if (data.success) {
          allComplaints = data.complaints;
          updateBadges();
          renderCurrentTab();
        }
      } catch (err) {
        console.error('Failed to load tickets:', err);
        document.getElementById('feed-container').innerHTML = `
          <div class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-center text-xs">
            Unable to connect to backend server at ${API_BASE}.
          </div>`;
      }
    }

    function updateBadges() {
      const myCount = allComplaints.filter(t => (t.officerId === CURRENT_OFFICER_ID || t.assigned_to_employee_id === CURRENT_OFFICER_ID)).length;
      const loggedDept = getLoggedDepartment();
      const deptCount = allComplaints.filter(t => (t.department === loggedDept || t.department_id === loggedDept) && t.status !== 'Resolved').length;

      document.getElementById('badge-my-count').innerText = myCount;
      document.getElementById('badge-dept-count').innerText = deptCount;
      document.getElementById('badge-all-count').innerText = allComplaints.length;
    }

    function switchTab(tabKey) {
      currentTab = tabKey;

      ['my_issues', 'dept_action', 'area_all'].forEach(k => {
        const btn = document.getElementById(`tab-${k.replace('_', '-')}`);
        if (k === tabKey) {
          btn.className = 'px-4 py-2.5 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition flex items-center gap-2';
        } else {
          btn.className = 'px-4 py-2.5 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition flex items-center gap-2';
        }
      });

      renderCurrentTab();
    }

    function renderCurrentTab() {
      updateBadges();
      const loggedDept = getLoggedDepartment();

      if (currentTab === 'my_issues') {
        document.getElementById('view-title').innerText = "My Filed Field Reports";
        document.getElementById('view-description').innerText = "Personal log of issues filed under Officer ID STF-8842.";
        document.getElementById('view-status-pill').innerText = "Citizen View Mode";

        const myComplaints = allComplaints.filter(t => (t.officerId === CURRENT_OFFICER_ID || t.assigned_to_employee_id === CURRENT_OFFICER_ID));
        renderCitizenStyleFeed(myComplaints);

      } else if (currentTab === 'dept_action') {
        document.getElementById('view-title').innerText = `Actionable Queue - ${loggedDept}`;
        document.getElementById('view-description').innerText = `Issues assigned exclusively to ${loggedDept}. You are authorized to resolve these.`;
        document.getElementById('view-status-pill').innerText = "Action Permission: ALLOWED";

        const deptComplaints = allComplaints.filter(t => (t.department === loggedDept || t.department_id === loggedDept));
        renderActionableDepartmentFeed(deptComplaints);

      } else if (currentTab === 'area_all') {
        document.getElementById('view-title').innerText = "Area Overview (All Departments)";
        document.getElementById('view-description').innerText = "Full visibility of all incidents logged in your area. Resolving is disabled for issues outside your logged department.";
        document.getElementById('view-status-pill').innerText = "Read-Only Overview Mode";

        renderReadOnlyFeed(allComplaints);
      }
    }

    function renderCitizenStyleFeed(tickets) {
      const container = document.getElementById('feed-container');
      if (!tickets || tickets.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 text-xs bg-slate-900 border border-slate-800 rounded-2xl">You have not registered any field issues yet.</div>`;
        return;
      }

      container.innerHTML = tickets.map(ticket => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex justify-between items-start">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">${ticket.ticketId || ticket.id || ticket.ticket_id}</span>
                <span class="text-xs font-semibold text-slate-300 bg-slate-800 px-2 py-0.5 rounded">${ticket.category}</span>
                <span class="text-[10px] font-semibold text-slate-400 bg-slate-800 px-2 py-0.5 rounded border border-slate-700">🏢 Assigned: ${ticket.department || ticket.department_id}</span>
              </div>
              <h3 class="text-sm font-bold text-slate-100 pt-1">${ticket.description}</h3>
            </div>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${
              ticket.status === 'Resolved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
            }">${ticket.status}</span>
          </div>

          <div class="flex items-center gap-4 bg-slate-950/40 p-3 rounded-xl border border-slate-800">
            <div>
              <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Before Image</span>
              <img src="${ticket.beforeImage || ticket.image || ticket.imageBase64}" class="w-16 h-16 object-cover rounded-lg bg-slate-800" />
            </div>
            <div>
              <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">After Image</span>
              ${ticket.afterImage 
                ? `<img src="${ticket.afterImage}" class="w-16 h-16 object-cover rounded-lg border border-emerald-500/40 bg-slate-800" />`
                : `<div class="w-16 h-16 rounded-lg border border-dashed border-slate-700 bg-slate-900 flex items-center justify-center text-[10px] text-slate-500">In Progress</div>`
              }
            </div>
          </div>

          <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-800 pt-3">
            <span>📍 ${ticket.location || (ticket.coords ? `GPS: ${ticket.coords.latitude}, ${ticket.coords.longitude}` : 'Location recorded')}</span>
            <span>🕒 Filed: ${new Date(ticket.createdAt || ticket.created_at || Date.now()).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
    }

    function renderActionableDepartmentFeed(tickets) {
      const container = document.getElementById('feed-container');
      if (!tickets || tickets.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 text-xs bg-slate-900 border border-slate-800 rounded-2xl">No open issues currently assigned to ${getLoggedDepartment()}.</div>`;
        return;
      }

      container.innerHTML = tickets.map(ticket => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex justify-between items-start">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">${ticket.ticketId || ticket.id || ticket.ticket_id}</span>
                <span class="text-xs font-semibold text-slate-300 bg-slate-800 px-2 py-0.5 rounded">${ticket.category}</span>
              </div>
              <h3 class="text-sm font-bold text-slate-100 pt-1">${ticket.description}</h3>
            </div>
            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${
              ticket.status === 'Resolved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
            }">${ticket.status}</span>
          </div>

          <div class="flex items-center gap-4 bg-slate-950/40 p-3 rounded-xl border border-slate-800">
            <div>
              <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Before Picture</span>
              <img src="${ticket.beforeImage || ticket.image || ticket.imageBase64}" class="w-16 h-16 object-cover rounded-lg bg-slate-800" />
            </div>
            <div>
              <span class="block text-[10px] font-bold text-slate-400 uppercase mb-1">After Picture</span>
              ${ticket.afterImage 
                ? `<img src="${ticket.afterImage}" class="w-16 h-16 object-cover rounded-lg border border-emerald-500/40 bg-slate-800" />`
                : `<div class="w-16 h-16 rounded-lg border border-dashed border-slate-700 bg-slate-900 flex items-center justify-center text-[10px] text-slate-500">Pending Fix</div>`
              }
            </div>
          </div>

          ${ticket.status !== 'Resolved' ? `
            <div class="flex items-center justify-between gap-3 pt-3 border-t border-slate-800">
              <div class="flex items-center gap-2">
                <label class="text-xs text-slate-400 font-medium">Upload Resolution Photo:</label>
                <input type="file" id="after-img-${ticket.ticketId || ticket.id}" accept="image/*" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-[11px] file:font-semibold file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 cursor-pointer"/>
              </div>
              <button onclick="resolveWithAfterImage('${ticket.ticketId || ticket.id}')" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition shadow-lg shadow-emerald-600/20">
                Mark Resolved
              </button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function renderReadOnlyFeed(tickets) {
      const container = document.getElementById('feed-container');
      const loggedDept = getLoggedDepartment();

      if (!tickets || tickets.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 text-xs bg-slate-900 border border-slate-800 rounded-2xl">No tickets found in the area.</div>`;
        return;
      }

      container.innerHTML = tickets.map(ticket => {
        const belongsToLoggedDept = (ticket.department === loggedDept || ticket.department_id === loggedDept);

        return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
          <div class="flex justify-between items-start">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded">${ticket.ticketId || ticket.id || ticket.ticket_id}</span>
                <span class="text-xs font-semibold text-slate-300 bg-slate-800 px-2 py-0.5 rounded">${ticket.category}</span>
                <span class="text-[10px] font-extrabold px-2 py-0.5 rounded ${belongsToLoggedDept ? 'bg-indigo-500/20 text-indigo-300 border border-indigo-500/30' : 'bg-slate-800 text-slate-400'}">
                  🏢 ${ticket.department || ticket.department_id}
                </span>
              </div>
              <h3 class="text-sm font-bold text-slate-100 pt-1">${ticket.description}</h3>
            </div>
            
            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${
              ticket.status === 'Resolved' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
            }">${ticket.status}</span>
          </div>

          <div class="flex items-center gap-4 bg-slate-950/40 p-3 rounded-xl border border-slate-800">
            <img src="${ticket.beforeImage || ticket.image || ticket.imageBase64}" class="w-16 h-16 object-cover rounded-lg bg-slate-800" />
            <div class="text-xs text-slate-400 space-y-1">
              <p>📍 Location: <strong class="text-slate-200">${ticket.location || (ticket.coords ? `${ticket.coords.latitude}, ${ticket.coords.longitude}` : 'N/A')}</strong></p>
              <p>🕒 Filed: ${new Date(ticket.createdAt || ticket.created_at || Date.now()).toLocaleString()}</p>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs border-t border-slate-800 pt-3">
            ${belongsToLoggedDept 
              ? `<span class="text-emerald-400 font-semibold">✔ Belongs to your department (${loggedDept}) — Go to "Actionable Queue" tab to resolve.</span>`
              : `<span class="text-slate-500 italic">🔒 Restricted: Belongs to ${ticket.department || ticket.department_id}. Only officers from that department can resolve this.</span>`
            }
          </div>
        </div>
      `;
      }).join('');
    }

    async function resolveWithAfterImage(ticketId) {
      const fileInput = document.getElementById(`after-img-${ticketId}`);
      let afterImageBase64 = null;

      if (fileInput && fileInput.files[0]) {
        const file = fileInput.files[0];
        afterImageBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      } else {
        if (!confirm('Resolve this ticket without adding an After photo?')) return;
      }

      try {
        const res = await fetch(`${API_BASE}/complaints/${ticketId}/resolve`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ afterImage: afterImageBase64 })
        });

        const data = await res.json();
        if (data.success) {
          fetchComplaints();
        } else {
          alert('Failed to update ticket: ' + (data.message || data.error));
        }
      } catch (err) {
        console.error('Error resolving ticket:', err);
        alert('Server connection error.');
      }
    }

    function openComplaintModal() {
      document.getElementById('register-modal').classList.remove('hidden');
    }

    function closeComplaintModal() {
      document.getElementById('register-modal').classList.add('hidden');
      document.getElementById('staff-complaint-form').reset();
    }

    function handleImageCaptured() {
      getGPSLocation();
    }

    function getGPSLocation() {
      const locationInput = document.getElementById('citizen-location');
      locationInput.value = "Fetching GPS coordinates...";

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            locationInput.value = `GPS (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
          },
          () => {
            locationInput.value = "GPS (12.9716, 77.5946)";
          }
        );
      }
    }

    async function handleCitizenComplaintSubmit(e) {
      e.preventDefault();
      
      const phone = document.getElementById('citizen-phone').value;
      const location = document.getElementById('citizen-location').value;
      const description = document.getElementById('citizen-description').value || "No description provided.";
      const imageInput = document.getElementById('citizen-image');
      const submitBtn = document.getElementById('submit-btn');
      const statusDiv = document.getElementById('modal-status');

      if (!imageInput.files[0]) return;

      submitBtn.disabled = true;
      submitBtn.innerText = 'AI Verification in progress...';
      
      statusDiv.className = 'text-xs p-2.5 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 block';
      statusDiv.innerText = 'Analyzing photo with Gemini AI...';

      const file = imageInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(evt) {
        const imageBase64 = evt.target.result;

        let detectedCategory = 'Pothole / Road Damage';
        try {
          const aiRes = await fetch(`${API_BASE}/classify-image`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageBase64 })
          });
          const aiData = await aiRes.json();
          if (aiData.success && aiData.category) {
            detectedCategory = aiData.category;
          }
        } catch (err) {
          console.warn("AI Classification unreachable, using default category");
        }

        try {
          const response = await fetch(`${API_BASE}/submit-complaint`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
              phone, 
              category: detectedCategory,
              description, 
              location, 
              imageBase64,
              officerId: CURRENT_OFFICER_ID
            })
          });

          const data = await response.json();

          if (data.success) {
            statusDiv.className = 'text-xs p-2.5 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 block';
            statusDiv.innerText = `Verified & Saved under Officer ID: ${CURRENT_OFFICER_ID}`;
            setTimeout(() => {
              closeComplaintModal();
              fetchComplaints();
            }, 1000);
          } else {
            statusDiv.className = 'text-xs p-2.5 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 block';
            statusDiv.innerText = data.message || 'Image rejected by AI.';
          }
        } catch (err) {
          statusDiv.className = 'text-xs p-2.5 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 block';
          statusDiv.innerText = 'Error connecting to server.';
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = 'Submit Incident';
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
